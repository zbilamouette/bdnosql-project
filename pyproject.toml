[project]
name = "bdnosql-project"
version = "2.0.0"
description = "SwiftLink — URL Shortener & Live Analytics using PostgreSQL and Redis"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "psycopg[binary,pool]>=3.3.6",
    "redis>=8.1.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
]
